[platformio]
default_envs = LILYGO-T-Dongle-S3-Mouse

[env:LILYGO-T-Dongle-S3-Mouse]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_8MB.csv
platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.5
    platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -D CFG_TUD_ENABLED
    -Wl,-z,muldefs
lib_deps =
    https://github.com/i-am-shodan/Adafruit_TinyUSB_Arduino#9305c9f25a9e2f03447b500a39a2429dd9aa58a5
    lovyan03/LovyanGFX @ 1.3.0
